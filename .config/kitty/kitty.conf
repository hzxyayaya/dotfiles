# 设置字体
font_family      JetBrains Mono Nerd Font
font_size        12.0
# 设置透明度
background_opacity 0.7
# 快捷键
map ctrl+shift+t new_tab

enable_ligatures yes

# 去除边框
window_border_width 0
hide_title yes 
# 窗口外观
background          #1e1e2e
foreground          #cdd6f4
cursor              #f5c2e7
cursor_shape        beam
include ~/.config/kitty/colors/gruvbox_dark.conf
