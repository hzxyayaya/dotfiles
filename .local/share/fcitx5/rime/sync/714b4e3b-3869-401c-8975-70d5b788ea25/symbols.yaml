# symbols.yaml — Rime 自定义符号配置
# 适用于 fcitx5-rime / ibus-rime
---
name: symbols
version: "1.0"
punctuator:
  full_shape:
    # 中文标点
    ",": "，"
    ".": "。"
    "?": "？"
    "!": "！"
    ":": "："
    ";": "；"
    "'": "’"
    "\"": "”"
    "(": "（"
    ")": "）"
    "[": "【"
    "]": "】"
    "{": "｛"
    "}": "｝"
    "<": "《"
    ">": "》"
    "\\": "、"
    "/": "／"
    "|": "｜"
    "~": "～"
    "`": "·"
    "@": "＠"
    "#": "＃"
    "$": "￥"
    "%": "％"
    "^": "……"
    "&": "＆"
    "*": "＊"
    "+": "＋"
    "-": "－"
    "=": "＝"
    "_": "——"
    
    # 数字单位符号
    "°": "°"
    "℃": "℃"
    "‰": "‰"
    "％": "％"

    # 箭头
    "←": "←"
    "→": "→"
    "↑": "↑"
    "↓": "↓"
    "↔": "↔"
    "⇐": "⇐"
    "⇒": "⇒"
    "⇑": "⇑"
    "⇓": "⇓"
    "⇔": "⇔"

    # 货币符号
    "¥": "¥"
    "€": "€"
    "$": "＄"
    "£": "£"
    "₽": "₽"

    # 星号与特殊符号
    "★": "★"
    "☆": "☆"
    "※": "※"
    "◎": "◎"
    "◇": "◇"
    "◆": "◆"
    "□": "□"
    "■": "■"
    "△": "△"
    "▲": "▲"
    "▽": "▽"
    "▼": "▼"

  half_shape:
    "\\": "、"
    ",": ","
    ".": "."
    "?": "?"
    "!": "!"
    ":": ":"
    ";": ";"
    "'": "'"
    "\"": "\""
    "(": "("
    ")": ")"
    "[": "["
    "]": "]"
    "{": "{"
    "}": "}"
    "<": "<"
    ">": ">"
